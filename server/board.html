<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Meier: workshop board</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --line: #2a2f3a;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #d6457f;
    --ok: #4ec98a;
    --field: #0f1115;
    --h: 36px;
    --note: calc(var(--h) * 2 + 8px);
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #2e3340 transparent; }
  *::-webkit-scrollbar { width: 4px; height: 4px; }
  *::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  *::-webkit-scrollbar-track, *::-webkit-scrollbar-corner { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #2e3340; border-radius: 99px; }
  *::-webkit-scrollbar-thumb:hover { background: #454b5a; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 52rem; }
  main { padding: 20px 24px 48px; width: 100%; }
  .wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.c-plate { width: 13%; }
  col.c-who { width: 15%; }
  col.c-st { width: 13%; }
  col.c-reg { width: 11%; }
  col.c-when { width: 15%; }
  col.c-quote { width: 7%; }
  col.c-note { width: 16%; }
  col.c-act { width: 10%; }
  th, td { padding: 12px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; padding-top: 14px; padding-bottom: 10px; }
  tr:last-child td { border-bottom: 0; }
  tr.booked td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.add { background: #14171e; }
  tr.add td { vertical-align: middle; }
  .plate { font-family: ui-monospace, Consolas, monospace; font-weight: 600; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .empty { color: var(--muted); }
  .label { display: none; }
  input, select, textarea, button {
    width: 100%; height: var(--h); background: var(--field); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; font: inherit;
    line-height: calc(var(--h) - 2px);
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 28px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%239aa3b2' d='M1.2 1.6L6 6.4l4.8-4.8'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 12px 8px;
  }
  textarea { height: var(--note); padding: 8px 10px; resize: none; overflow: auto; line-height: 1.4; }
  tr[data-id] textarea { height: 52px; }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; white-space: nowrap; font-weight: 500; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); height: auto; padding: 7px 10px; }
  tr.add textarea,
  tr.add .add-btn {
    display: block;
    height: var(--note);
    min-height: var(--note);
    max-height: var(--note);
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
  }
  tr.add .add-btn {
    border: 1px solid transparent;
    padding: 0;
    line-height: calc(var(--note) - 2px);
  }
  .tools { display: grid; grid-template-columns: minmax(12rem, 1fr) 14rem 16rem; gap: 10px; margin-bottom: 12px; }
  .tools input, .tools select { max-width: none; }
  th .sort {
    background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit;
    text-transform: inherit; padding: 0; height: auto; width: auto; cursor: pointer; text-align: left;
  }
  th .sort.active { color: var(--text); }
  th .sort::after { content: ""; margin-left: 6px; font-size: 10px; }
  th .sort.active.asc::after { content: "↑"; }
  th .sort.active.desc::after { content: "↓"; }
  .more-cell { display: none; }
  .empty-row td { color: var(--muted); text-align: center; padding: 28px 14px; }
  .muted { color: var(--muted); font-size: 11px; }
  .saved { color: var(--ok); font-size: 12px; }
  @media (max-width: 900px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .wrap { background: transparent; border: 0; overflow: visible; }
    table, thead, tbody, tr, th, td, colgroup, col { display: block; width: 100%; min-width: 0; }
    colgroup, thead { display: none; }
    tr { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; padding: 14px; }
    tr.booked { box-shadow: inset 3px 0 0 var(--accent); }
    tr.booked td:first-child { box-shadow: none; }
    .label { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    tr.add td { display: grid; grid-template-columns: 8.5rem 1fr; gap: 8px 12px; align-items: center; border: 0; padding: 8px 0; }
    tr.add td:last-child { grid-template-columns: 1fr; border-bottom: 0; }
    .add-btn, button.ghost { width: 100%; }
    .add-btn { height: var(--note); }
    button.ghost { height: var(--h); }
    tr[data-id] {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      align-items: start;
    }
    tr[data-id] > td { display: none; padding: 0; border: 0; }
    tr[data-id] > td:nth-child(1),
    tr[data-id] > td:nth-child(2) { display: block; }
    tr[data-id] > td:nth-child(1) .label,
    tr[data-id] > td:nth-child(2) .label { margin-bottom: 4px; }
    tr[data-id] > .more-cell { display: block; grid-column: 1 / -1; }
    .more-btn {
      width: 100%;
      height: var(--h);
      background: var(--field);
      border: 1px solid var(--line);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      text-transform: capitalize;
      font-weight: 500;
    }
    .more-btn::after { content: "▾"; color: var(--muted); font-size: 12px; }
    tr[data-id].open .more-btn::after { content: "▴"; }
    tr[data-id].open > td.detail {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 8.5rem 1fr;
      gap: 8px 12px;
      align-items: center;
      padding-top: 4px;
    }
    tr[data-id].open > td.detail:last-child { grid-template-columns: 1fr; }
  }
  @media (max-width: 800px) {
    .tools { grid-template-columns: 1fr 1fr; }
    .tools input { grid-column: 1 / -1; }
  }
  @media (max-width: 520px) {
    tr.add td { grid-template-columns: 1fr; gap: 4px; }
    h1 { font-size: 18px; }
    .tools { grid-template-columns: 1fr; }
    .tools input { grid-column: auto; }
    .empty-row td { display: block; text-align: left; }
    tr[data-id].open > td.detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Garage Meier: workshop board</h1>
    <p>Cars in the shop, plus bookings Anna just made. This is what she reads back when someone asks "is my car ready?"</p>
    <p id="smsmode"></p>
  </div>
  <span id="status" class="muted"></span>
</header>
<main>
  <form id="add"></form>
  <div class="tools">
    <input id="q" type="search" placeholder="Search plate, name, phone…" aria-label="Search">
    <select id="filter" aria-label="Filter by status">
      <option value="">All statuses</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="registered:desc">Newest registered</option>
      <option value="registered:asc">Oldest registered</option>
      <option value="ready:asc">Ready soonest</option>
      <option value="ready:desc">Ready latest</option>
    </select>
  </div>
  <div class="wrap">
    <table>
      <colgroup>
        <col class="c-plate"><col class="c-who"><col class="c-st"><col class="c-reg"><col class="c-when"><col class="c-quote"><col class="c-note"><col class="c-act">
      </colgroup>
      <thead>
        <tr>
          <th>Plate / car</th>
          <th>Customer</th>
          <th>Status</th>
          <th><button type="button" class="sort active desc" data-sort="registered">Registered</button></th>
          <th><button type="button" class="sort" data-sort="ready">Expected ready</button></th>
          <th>Quote CHF</th>
          <th>Note for the customer</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr class="add">
          <td>
            <span class="label">Plate / car</span>
            <div>
              <input name="plate" placeholder="ZH 123456" required aria-label="Plate" form="add" style="margin-bottom:8px">
              <input name="car" placeholder="VW Golf" aria-label="Car" form="add">
            </div>
          </td>
          <td>
            <span class="label">Customer</span>
            <div>
              <input name="customer" placeholder="Name" aria-label="Customer" form="add" style="margin-bottom:8px">
              <input name="phone" placeholder="+41 79 …" aria-label="Phone" form="add">
            </div>
          </td>
          <td>
            <span class="label">Status</span>
            <select name="status" aria-label="Status" form="add"></select>
          </td>
          <td>
            <span class="label">Registered</span>
            <div class="empty">Now</div>
          </td>
          <td>
            <span class="label">Expected ready</span>
            <input name="readyAt" type="datetime-local" aria-label="Expected ready" form="add">
          </td>
          <td>
            <span class="label">Quote CHF</span>
            <input name="quoteChf" placeholder="—" aria-label="Quote CHF" form="add">
          </td>
          <td>
            <span class="label">Note</span>
            <textarea name="note" placeholder="Note for the customer" aria-label="Note" form="add"></textarea>
          </td>
          <td><button type="submit" class="add-btn" form="add">Add car</button></td>
        </tr>
      </tbody>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const rows = document.getElementById("rows");
const statusEl = document.getElementById("status");
const addStatus = document.querySelector("tr.add select[name=status]");
const qEl = document.getElementById("q");
const filterEl = document.getElementById("filter");
const sortEl = document.getElementById("sort");
let statuses = {};
let allJobs = [];
let sortBy = "registered";
let sortDir = "desc";
const openIds = new Set();

const toLocal = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fromLocal = (v) => (v ? new Date(v).toISOString() : "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const prettyPlate = (s) => String(s || "").replace(/^([A-Z]{2})\s*(\d+)$/i, (_, a, b) => `${a.toUpperCase()} ${b}`);
const dash = (s) => (s && String(s).trim() ? esc(s) : `<span class="empty">—</span>`);
const fmtReg = (iso) => {
  if (!iso) return `<span class="empty">—</span>`;
  const d = new Date(iso);
  if (isNaN(d)) return `<span class="empty">—</span>`;
  return esc(d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }));
};
const options = (selected) => Object.keys(statuses).map((s) => `<option value="${s}" ${s === selected ? "selected" : ""}>${s.replace(/_/g, " ")}</option>`).join("");

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok && r.status !== 204) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9+]/g, "");
const matches = (j) => {
  if (filterEl.value && j.status !== filterEl.value) return false;
  const q = norm(qEl.value);
  if (!q) return true;
  return [j.plate, j.car, j.customer, j.phone, j.note].some((s) => norm(s).includes(q));
};

const stamp = (j, key) => {
  const iso = key === "ready" ? j.readyAt : j.createdAt || j.updatedAt;
  const t = iso ? new Date(iso).getTime() : NaN;
  return Number.isFinite(t) ? t : null;
};
const sorted = (jobs) =>
  [...jobs].sort((a, b) => {
    const av = stamp(a, sortBy);
    const bv = stamp(b, sortBy);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return sortDir === "asc" ? av - bv : bv - av;
  });
const syncSortUi = () => {
  sortEl.value = `${sortBy}:${sortDir}`;
  document.querySelectorAll("th .sort").forEach((btn) => {
    const on = btn.dataset.sort === sortBy;
    btn.classList.toggle("active", on);
    btn.classList.toggle("asc", on && sortDir === "asc");
    btn.classList.toggle("desc", on && sortDir === "desc");
  });
};

function render() {
  const jobs = sorted(allJobs.filter(matches));
  if (!jobs.length) {
    rows.innerHTML = `<tr class="empty-row"><td colspan="8">No cars match.</td></tr>`;
    return;
  }
  rows.innerHTML = jobs.map((j) => `
    <tr class="${j.status === "booked" ? "booked" : ""} ${openIds.has(j.id) ? "open" : ""}" data-id="${j.id}">
      <td><span class="label">Plate / car</span><div><div class="plate">${esc(prettyPlate(j.plate))}</div><div class="sub">${dash(j.car)}</div></div></td>
      <td><span class="label">Customer</span><div><div>${dash(j.customer)}</div><div class="sub">${dash(j.phone)}</div></div></td>
      <td class="more-cell">
        <button type="button" class="more-btn" data-more aria-expanded="${openIds.has(j.id)}">${esc((j.status || "").replace(/_/g, " "))}</button>
      </td>
      <td class="detail">
        <span class="label">Status</span>
        <div>
          <select data-k="status" aria-label="Status">${options(j.status)}</select>
        </div>
      </td>
      <td class="detail"><span class="label">Registered</span><div>${fmtReg(j.createdAt || j.updatedAt)}</div></td>
      <td class="detail">
        <span class="label">Expected ready</span>
        <input data-k="readyAt" type="datetime-local" value="${toLocal(j.readyAt)}" aria-label="Expected ready">
      </td>
      <td class="detail">
        <span class="label">Quote CHF</span>
        <input data-k="quoteChf" value="${esc(j.quoteChf)}" placeholder="—" aria-label="Quote CHF">
      </td>
      <td class="detail">
        <span class="label">Note</span>
        <textarea data-k="note" aria-label="Note">${esc(j.note)}</textarea>
      </td>
      <td class="detail">
        <button class="ghost" type="button" data-del>Remove</button>
      </td>
    </tr>`).join("");
}

async function load() {
  const data = await api("GET", "/api/jobs");
  statuses = data.statuses;
  addStatus.innerHTML = options("received");
  const keep = filterEl.value;
  filterEl.innerHTML = `<option value="" ${keep ? "" : "selected"}>All statuses</option>` + options(keep);
  document.getElementById("smsmode").textContent = data.smsLive
    ? "SMS: live. Customers get a text when a car is ready or needs approval."
    : "SMS: test mode. Texts are saved to data/sms-outbox, not sent.";
  allJobs = data.jobs;
  render();
}

qEl.addEventListener("input", render);
filterEl.addEventListener("change", render);
sortEl.addEventListener("change", () => {
  const [by, dir] = sortEl.value.split(":");
  sortBy = by;
  sortDir = dir;
  syncSortUi();
  render();
});
document.querySelector("thead").addEventListener("click", (e) => {
  const btn = e.target.closest(".sort");
  if (!btn) return;
  if (sortBy === btn.dataset.sort) sortDir = sortDir === "asc" ? "desc" : "asc";
  else {
    sortBy = btn.dataset.sort;
    sortDir = sortBy === "ready" ? "asc" : "desc";
  }
  syncSortUi();
  render();
});

rows.addEventListener("change", async (e) => {
  const el = e.target.closest("[data-k]");
  if (!el) return;
  const id = el.closest("[data-id]").dataset.id;
  const value = el.dataset.k === "readyAt" ? fromLocal(el.value) : el.value;
  await api("PATCH", `/api/jobs/${id}`, { [el.dataset.k]: value });
  const job = allJobs.find((j) => j.id === id);
  if (job) job[el.dataset.k] = value;
  if (el.dataset.k === "status") await load();
  else if (el.dataset.k === "readyAt") render();
  statusEl.innerHTML = '<span class="saved">Saved</span>';
  setTimeout(() => (statusEl.textContent = ""), 1500);
});

rows.addEventListener("click", async (e) => {
  const more = e.target.closest("[data-more]");
  if (more) {
    const tr = more.closest("[data-id]");
    const open = tr.classList.toggle("open");
    more.setAttribute("aria-expanded", open);
    if (open) openIds.add(tr.dataset.id);
    else openIds.delete(tr.dataset.id);
    return;
  }
  if (!e.target.matches("[data-del]")) return;
  const id = e.target.closest("[data-id]").dataset.id;
  if (!confirm("Remove this car from the board?")) return;
  openIds.delete(id);
  await api("DELETE", `/api/jobs/${id}`);
  load();
});

document.getElementById("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  f.readyAt = fromLocal(f.readyAt);
  await api("POST", "/api/jobs", f);
  e.target.reset();
  load();
});

load().catch((err) => (statusEl.textContent = "Could not load jobs: " + err.message));
</script>
</body>
</html>
